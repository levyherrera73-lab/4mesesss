<style>
:root{--bg:#fbf4ee;--panel:#f1e6dc;--ink:#2a1f3d;--dim:#7d6f8f;--ps:#c2185b;--ok:#0f8a6a;--acc:#7b3fe4;--line:#2a1f3d22;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0713;--panel:#17101f;--ink:#f3e9ff;--dim:#8f81a8;--ps:#ff7ab6;--ok:#7cf5d0;--acc:#b79cff;--line:#ffffff1f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0713;--panel:#17101f;--ink:#f3e9ff;--dim:#8f81a8;--ps:#ff7ab6;--ok:#7cf5d0;--acc:#b79cff;--line:#ffffff1f;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:14px;overflow:hidden}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#term{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
#term:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 2px,#00000010 2px 3px)}
.top{display:flex;align-items:center;gap:7px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.top i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.top i:nth-child(2){background:#febc2e}.top i:nth-child(3){background:#28c840}
.top span{margin-left:8px;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#out{flex:1;overflow-y:auto;padding:16px 16px 24px;line-height:1.65;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ln{margin:0 0 4px;white-space:pre-wrap;word-break:break-word;min-height:1.2em}
.dim{color:var(--dim)}.ok{color:var(--ok)}.acc{color:var(--acc)}
.ps{color:var(--ps);font-weight:700}
.cmd .c{color:var(--ink)}
.p{margin:6px 0 14px;padding-left:12px;border-left:2px solid var(--ps);font-size:15px;line-height:1.75}
.prog{color:var(--acc)}
.logo{margin:0 0 10px;color:var(--ps);font-size:11px;line-height:1.15}
#login form{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
#login label{display:flex;align-items:center;gap:8px;flex:1 1 230px}
#k{flex:1;min-width:0;background:transparent;border:0;border-bottom:2px solid var(--ps);padding:6px 2px;font-size:16px;caret-color:var(--ps);letter-spacing:.05em}
#login button{background:var(--ps);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
#hint{min-height:1.4em;margin-top:8px;color:var(--ps)}
#hint.bad{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.win{margin:8px 0 12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);max-width:420px}
.win .tb{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:11px;color:var(--dim)}
.win .tb i{width:8px;height:8px;border-radius:50%;background:var(--dim);opacity:.6}
.win .tb span{margin-left:6px}
.win img{display:block;width:100%;max-height:58vh;object-fit:cover;filter:blur(26px) saturate(0);transform:scale(1.08);animation:dec 2.4s ease-out forwards}
@keyframes dec{to{filter:none;transform:none}}
.heart{margin:14px 0;color:var(--ps);font-size:17px;line-height:1.05;text-shadow:0 0 14px var(--ps);animation:beat 1.3s ease-in-out infinite;white-space:pre}
@keyframes beat{50%{transform:scale(1.07)}}
.bot{flex:none;padding:10px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);position:relative;z-index:2}
#next{width:100%;border:0;border-radius:12px;padding:15px;font-weight:700;font-size:15px;background:var(--ps);color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent}
#next:disabled{opacity:.35;cursor:default}
#next:not(:disabled):active{transform:scale(.98)}
.pop{position:fixed;z-index:9;font-size:26px;pointer-events:none;animation:pp 1.2s ease-out forwards}
@keyframes pp{to{opacity:0;transform:translate(var(--x),-130px) scale(1.6)}}
@media (prefers-reduced-motion:reduce){#term:after{display:none}.win img{animation:none;filter:none;transform:none}.heart,#hint.bad,.pop{animation:none}}
</style></head><body>

<script>
var $=function(i){return document.getElementById(i)},out=$('out'),nb=$('next'),skip=false,running=false,idx=0;
function sleep(ms){return new Promise(function(r){if(skip)return r();setTimeout(r,ms)})}
function down(){out.scrollTop=out.scrollHeight}
function line(c){var d=document.createElement('div');d.className='ln '+(c||'');out.appendChild(d);return d}
async function type(el,t,sp){for(var i=0;i<t.length;i++){el.textContent+=t.charAt(i);if(i%3===0)down();await sleep(sp)}down()}
async function cmd(t){var d=line('cmd');d.innerHTML='<span class="ps">mi_amor@nosotros:~$</span> <span class="c"></span>';await type(d.querySelector('.c'),t,32);await sleep(300)}
async function say(t,c,sp){var d=line(c);await type(d,t,sp||14)}
async function para(t){var d=document.createElement('div');d.className='ln p';out.appendChild(d);await type(d,t,15);await sleep(200)}
async function prog(label){var d=line('prog');for(var n=0;n<=100;n+=5){var f=n/5;d.textContent=label+'\n['+'█'.repeat(f)+'░'.repeat(20-f)+'] '+n+'%';down();await sleep(70)}}
async function photo(id,name){var w=document.createElement('div');w.className='win';w.innerHTML='<div class="tb"><i></i><i></i><i></i><span>'+name+'</span></div>';var im=document.createElement('img');im.alt='Mi amor y yo';im.src=$(id).src;w.appendChild(im);out.appendChild(w);down();await sleep(2400)}
function pop(x,y){var e=document.createElement('span');e.className='pop';e.textContent=['♥','💖','✨'][Math.floor(Math.random()*3)];e.style.left=x+'px';e.style.top=y+'px';e.style.setProperty('--x',(Math.random()*90-45)+'px');document.body.appendChild(e);setTimeout(function(){e.remove()},1200)}
function days(){var s=new Date(2026,5,12),n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.max(0,Math.round((t-s)/864e5))}
var steps=[
{l:'./abrir_4_meses.sh',f:async function(){await cmd('./abrir_4_meses.sh');await prog('cargando recuerdos…');await say('✔ 4 meses cargados correctamente','ok')}},
{l:'uptime',f:async function(){await cmd('uptime');await say('en línea desde .... 12/06/2026');await say('tiempo juntos ..... '+days()+' días (4 meses)');await say('errores ........... 0','ok');await say('cariño ............ ∞','ok')}},
{l:'cat gracias.txt',f:async function(){await cmd('cat gracias.txt');await para('Hoy cumplimos 4 meses de novios y no quería dejar pasar el día sin decirte algo importante: gracias, mi amor. Gracias por estar, por quedarte y por hacer que estos meses hayan sido de lo mejor que me ha pasado.')}},
{l:'cat historia.log',f:async function(){await cmd('cat historia.log');await say('[12/06/2026] inicio de sesión: empezamos a ser novios','acc');await para('Desde entonces cada semana contigo ha sumado algo bueno. Me gusta cómo hemos ido conociéndonos, cómo cada vez hay más confianza y cómo con el tiempo todo se siente más natural entre nosotros.')}},
{l:'abrir foto1.jpg',f:async function(){await cmd('abrir foto1.jpg');await say('decodificando…','dim');await photo('p1','foto1.jpg');await say('# de las fotos que no se borran nunca','dim')}},
{l:'cat gracias_2.txt',f:async function(){await cmd('cat gracias_2.txt');await para('Gracias por tu paciencia, por tus risas, por escucharme cuando lo necesito y por tener esa manera tuya de hacerme sentir tranquilo. Contigo puedo ser yo mismo, y eso no tiene precio.')}},
{l:'grep "cuatro meses son poco"',f:async function(){await cmd('grep -r "cuatro meses son poco" .');await say('(0 resultados)','dim');await para('Sé que cuatro meses pueden parecer poco, pero para mí significan muchísimo. Cada día que pasa me doy más cuenta de lo afortunado que soy de tenerte a mi lado, bebé.')}},
{l:'abrir foto2.jpg',f:async function(){await cmd('abrir foto2.jpg');await say('decodificando…','dim');await photo('p2','foto2.jpg');await say('# movida, pero la guardo igual 😄','dim')}},
{l:'cat futuro.md',f:async function(){await cmd('cat futuro.md');await para('No hace falta que todo sea perfecto: me quedo con los momentos sencillos, con las tonterías y con todo lo que vamos construyendo juntos poquito a poco.');await para('Quiero que sigamos creciendo juntos, aprendiendo el uno del otro y creando muchos más recuerdos. Que estos 4 meses sean solo el principio de todo lo que nos queda por vivir.')}},
{l:'git commit -m "4 meses"',f:async function(){await cmd('git commit -m "4 meses y los que quedan"');await say('[main 4m3535] 4 meses y los que quedan');await say(' 1 corazón modificado, 1 vida mejorada (+)','ok');await para('Gracias por cada momento, por cada detalle y por formar parte de mi vida. Te quiero muchísimo, mi niña. ❤️')}},
{l:'sudo te-quiero',f:async function(){await cmd('sudo te-quiero');await say('[sudo] contraseña de mi_amor: ********','dim');await sleep(500);await say('permiso concedido ✔','ok');var h=document.createElement('pre');h.className='heart';h.textContent='  ██████    ██████\n ████████  ████████\n ████████████████████\n  ██████████████████\n    ██████████████\n      ██████████\n        ██████\n          ██';out.appendChild(h);down();for(var i=0;i<18;i++)setTimeout(function(){pop(Math.random()*innerWidth,innerHeight*.7)},i*90);await sleep(900);await say('Feliz 4 meses, mi amor. 🫶','acc',30);await say('Por muchos meses (y años) más.','',30);await say('— tu novio, que te adora ❤️','ok',30)}}
];
async function advance(){if(running)return;running=true;skip=false;nb.disabled=true;await steps[idx].f();idx++;running=false;if(idx<steps.length){nb.textContent='ejecutar ▸ '+steps[idx].l;nb.disabled=false}else{nb.style.display='none'}down()}
nb.onclick=advance;
out.addEventListener('click',function(){skip=true});
function check(){var v=$('k').value.replace(/\D/g,'');var h=$('hint');
if(v==='12062026'||v==='120626'){h.textContent='acceso concedido ✔';h.style.color='var(--ok)';$('k').disabled=true;$('go').disabled=true;
setTimeout(function(){out.innerHTML='';line('dim').textContent='# toca la pantalla para ir más rápido';advance()},900)}
else{h.classList.remove('bad');void h.offsetWidth;h.classList.add('bad');h.textContent='✖ contraseña incorrecta · pista: el día en que empezó todo 💭'}}
$('go').onclick=check;$('k').addEventListener('keydown',function(e){if(e.key==='Enter')check()});
</script></body></html>
